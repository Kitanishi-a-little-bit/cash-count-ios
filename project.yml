name: CashCount
options:
  bundleIdPrefix: com.rejitokinko
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
targets:
  CashCount:
    type: application
    platform: iOS
    sources: [CashCount]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rejitokinko.cashcount
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: レジと金庫
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: '1,2'
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: '1.0'
  CashCountTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CashCountTests]
    dependencies:
      - target: CashCount
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  CashCountUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [CashCountUITests]
    dependencies:
      - target: CashCount
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: CashCount
schemes:
  CashCount:
    build:
      targets:
        CashCount: all
        CashCountTests: [test]
        CashCountUITests: [test]
    test:
      targets: [CashCountTests, CashCountUITests]
