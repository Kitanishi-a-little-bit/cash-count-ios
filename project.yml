name: CashCount
options:
  bundleIdPrefix: com.cashcount
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
targets:
  CashCount:
    type: application
    platform: iOS
    sources: [CashCount]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cashcount.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: お金カウント
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: '1,2'
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: '1.0'
  CashCountTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CashCountTests]
    dependencies:
      - target: CashCount
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  CashCount:
    build:
      targets:
        CashCount: all
        CashCountTests: [test]
    test:
      targets: [CashCountTests]
