name: App Store screenshots
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/screenshots.yml
      - scripts/capture-screenshots.py
      - scripts/render-store-screenshots.swift
      - CashCount/**
permissions:
  contents: read
concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true
jobs:
  capture:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build simulator app
        run: |
          xcodebuild build -project CashCount.xcodeproj -scheme CashCount \
            -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/screenshots CODE_SIGNING_ALLOWED=NO
      - name: Capture iPhone and iPad
        run: python3 scripts/capture-screenshots.py
      - name: Compose iPhone and iPad store artwork
        run: swift scripts/render-store-screenshots.swift
      - name: Validate store image sizes
        run: |
          python3 - <<'PY'
          import pathlib, struct
          for device, expected in [("iphone", (1206, 2622)), ("ipad", (2064, 2752))]:
              files = list(pathlib.Path(f"screenshots/store-{device}").glob("*.png"))
              assert len(files) == 3, f"Expected three {device} screenshots"
              for file in files:
                  data = file.read_bytes()
                  assert data[:8] == b"\x89PNG\r\n\x1a\n", file
                  w, h, depth, color = struct.unpack(">IIBB", data[16:26])
                  assert (w, h, depth, color) == (*expected, 8, 2), (file, w, h, depth, color)
                  print(f"{file}: {w}x{h}, opaque RGB")
          PY
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-store-screenshots
          path: screenshots/
          if-no-files-found: warn
